<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 的作用</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.7;
    }

    /* 导航栏 */
    header {
      position: sticky;
      top: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    header .logo {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 24px;
      font-size: 15px;
      transition: color 0.2s;
    }

    nav a:hover { color: #38bdf8; }

    /* 首屏 */
    .hero {
      text-align: center;
      padding: 100px 20px 80px;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    }

    .hero h1 {
      font-size: 48px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 18px;
      color: #94a3b8;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 内容区 */
    .section {
      max-width: 960px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .section h2 {
      font-size: 30px;
      color: #38bdf8;
      margin-bottom: 24px;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .card h3 {
      color: #f1f5f9;
      margin-bottom: 10px;
      font-size: 19px;
    }

    .card p {
      color: #94a3b8;
      font-size: 15px;
    }

    /* 页脚 */
    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #1e293b;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 32px; }
      header { padding: 14px 20px; }
      nav a { margin-left: 14px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AI 的作用</div>
    <nav>
      <a href="#intro">简介</a>
      <a href="#fields">应用领域</a>
      <a href="#future">未来展望</a>
    </nav>
  </header>

  <section class="hero">
    <h1>人工智能的作用</h1>
    <p>这里是一句简介占位文字，之后你可以告诉我具体写什么内容。</p>
  </section>

  <section class="section" id="intro">
    <h2>什么是 AI</h2>
    <div class="cards">
      <div class="card">
        <h3>占位标题一</h3>
        <p>这里是内容占位，等待你提供具体文字。</p>
      </div>
      <div class="card">
        <h3>占位标题二</h3>
        <p>这里是内容占位，等待你提供具体文字。</p>
      </div>
    </div>
  </section>

  <section class="section" id="fields">
    <h2>AI 的应用领域</h2>
    <div class="cards">
      <div class="card">
        <h3>领域一</h3>
        <p>内容占位。</p>
      </div>
      <div class="card">
        <h3>领域二</h3>
        <p>内容占位。</p>
      </div>
      <div class="card">
        <h3>领域三</h3>
        <p>内容占位。</p>
      </div>
    </div>
  </section>

  <section class="section" id="future">
    <h2>未来展望</h2>
    <div class="cards">
      <div class="card">
        <h3>占位标题</h3>
        <p>内容占位，等待填充。</p>
      </div>
    </div>
  </section>

  <footer>
    © 2026 DoctorKato · Powered by GitHub Pages
  </footer>

</body>
</html>
